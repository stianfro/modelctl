name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.6'
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68
        with:
          tool: just@1.58.0
      - run: just ci distribution-test
      - name: Build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: just release "$RELEASE_TAG"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes dist/"$RELEASE_TAG"/*
